version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pandit-booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pandit_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pandit_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: pandit-booking-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pandit_booking
      CORS_ORIGIN: http://localhost:5174
      OTP_PROVIDER: ${OTP_PROVIDER:-aws}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_SNS_SENDER_ID: ${AWS_SNS_SENDER_ID:-}
      AWS_SNS_ENTITY_ID: ${AWS_SNS_ENTITY_ID:-}
      AWS_SNS_TEMPLATE_ID: ${AWS_SNS_TEMPLATE_ID:-}
      OTP_MESSAGE_TEMPLATE: ${OTP_MESSAGE_TEMPLATE:-}
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
